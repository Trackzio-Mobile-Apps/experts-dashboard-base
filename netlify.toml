[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# SPA fallback — Netlify Functions with `config.path` handle /api/* first.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
